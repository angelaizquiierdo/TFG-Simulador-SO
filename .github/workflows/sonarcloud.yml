name: SonarCloud
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      # En lugar de @v4, usamos el hash SHA del commit exacto de esa versión
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          
      # En lugar de @master, usamos el hash SHA de la versión estable
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@38cf334b4f38f7cc7ce01d842512f43a99264c7f # v3.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
