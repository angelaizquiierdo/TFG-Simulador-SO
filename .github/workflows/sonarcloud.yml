name: SonarCloud
on:
  push:
    branches:
      - main # O la rama principal que utilices (ej. master)
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Crucial: SonarCloud necesita el historial completo para evaluar PRs correctamente
          
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # GitHub proporciona este token automáticamente
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}    # El token que acabas de configurar
