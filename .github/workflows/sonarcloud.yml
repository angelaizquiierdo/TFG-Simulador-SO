name: SonarCloud
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      # 1. Checkout del código
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      # 2. Configurar el entorno de Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Ajusta esto a la versión de Node que uses localmente

      # 3. Instalar las dependencias del proyecto
      - name: Install dependencies
        run: npm install

      # 4. Ejecutar las pruebas para generar el reporte de cobertura
      - name: Run tests and generate coverage
        run: npm run test -- --coverage
        
      # Paso de advertencia si falta la contraseña
      - name: SonarCloud token no configurado
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::warning::SONAR_TOKEN no está configurado. Se omite el análisis de SonarCloud."
      
      # 5. Escáner de SonarCloud enviando el archivo de cobertura
      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5.0.0 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
